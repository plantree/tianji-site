name: 每周增量爬取

on:
  schedule:
    # 每周一 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 增量爬取
        run: python crawler.py --delay 1.5

      - name: 提交新增文章
        run: |
          if [ -z "$(git status --porcelain articles)" ]; then
            echo "没有新文章，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "chore: 增量爬取 $(date -u +%Y-%m-%d)"
          git push
